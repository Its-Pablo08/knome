    <script>
        // Suppress Chromium Windows WebGPU powerPreference warning (https://crbug.com/369219127)
        (function() {
            try {
                if (typeof window !== 'undefined') {
                    // 1. Patch GPU.prototype if available
                    if (window.GPU && window.GPU.prototype && typeof window.GPU.prototype.requestAdapter === 'function') {
                        const origRequestAdapter = window.GPU.prototype.requestAdapter;
                        window.GPU.prototype.requestAdapter = function(options) {
                            if (options && typeof options === 'object' && 'powerPreference' in options) {
                                const sanitized = { ...options };
                                delete sanitized.powerPreference;
                                return origRequestAdapter.call(this, sanitized);
                            }
                            return origRequestAdapter.call(this, options);
                        };
                    }

                    // 2. Patch Navigator.prototype.gpu getter if available
                    if (typeof Navigator !== 'undefined' && Navigator.prototype) {
                        const gpuDesc = Object.getOwnPropertyDescriptor(Navigator.prototype, 'gpu');
                        if (gpuDesc && gpuDesc.get) {
                            const origGet = gpuDesc.get;
                            Object.defineProperty(Navigator.prototype, 'gpu', {
                                configurable: true,
                                enumerable: true,
                                get: function() {
                                    const gpuInstance = origGet.call(this);
                                    if (gpuInstance && typeof gpuInstance.requestAdapter === 'function' && !gpuInstance._sanitized) {
                                        const origReq = gpuInstance.requestAdapter.bind(gpuInstance);
                                        gpuInstance.requestAdapter = function(options) {
                                            if (options && typeof options === 'object' && 'powerPreference' in options) {
                                                const sanitized = { ...options };
                                                delete sanitized.powerPreference;
                                                return origReq(sanitized);
                                            }
                                            return origReq(options);
                                        };
                                        gpuInstance._sanitized = true;
                                    }
                                    return gpuInstance;
                                }
                            });
                        }
                    }

                    // 3. Directly patch navigator.gpu instance if already populated
                    if (typeof navigator !== 'undefined' && navigator.gpu && typeof navigator.gpu.requestAdapter === 'function' && !navigator.gpu._sanitized) {
                        const origRequestAdapter = navigator.gpu.requestAdapter.bind(navigator.gpu);
                        navigator.gpu.requestAdapter = function(options) {
                            if (options && typeof options === 'object' && 'powerPreference' in options) {
                                const sanitized = { ...options };
                                delete sanitized.powerPreference;
                                return origRequestAdapter(sanitized);
                            }
                            return origRequestAdapter(options);
                        };
                        navigator.gpu._sanitized = true;
                    }

                    // 4. Filter console warnings referencing crbug.com/369219127
                    const origWarn = console.warn;
                    console.warn = function(...args) {
                        if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('powerPreference') || args[0].includes('369219127'))) {
                            return;
                        }
                        return origWarn.apply(console, args);
                    };
                }
            } catch (_) {}
        })();

        // Apply saved theme (defaults to light mode)
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
